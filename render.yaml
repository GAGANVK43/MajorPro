services:
  - type: web
    name: diasense-ai-backend
    env: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: DATABASE_URL
        sync: false          # Set to your Supabase PostgreSQL URL (Session mode port 5432)
                             # Format: postgresql://postgres.[ref]:[password]@aws-0-ap-southeast-1.pooler.supabase.com:5432/postgres
      - key: SECRET_KEY
        sync: false          # Set a long random secret key
      - key: GEMINI_API_KEY
        sync: false          # Optional — for AI chatbot
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: false
      - key: CORS_ORIGINS
        sync: false          # Set to your Vercel URL e.g. https://diasense-ai.vercel.app
